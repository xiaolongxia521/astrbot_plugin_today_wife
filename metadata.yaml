name: astrbot_plugin_today_wife
display_name: 今日老婆 (分群配对版)
description: 支持分群固定配对，可设置当老婆不在群时的提示文本，凌晨4点重置，支持强娶、离婚功能，允许拥有多个群老婆。新增「所有人都是我老婆」「强娶全体成员」「全部离婚」「老婆关系网」功能，支持活跃群友批量绑定、全员绑定和关系网可视化。
author: xiaolongxia521
version: 3.2.0
repo: https://github.com/xiaolongxia521/astrbot_plugin_today_wife
config_schema:
  items:
    reset_hour:
      type: int
      description: 每天重置的时间（小时）
      default: 4
    active_days:
      type: int
      description: 发言活跃天数（用于随机老婆功能）
      hint: 填写 1 表示今日发言过即可，2 表示今日或昨日发言过，以此类推
      default: 1
    fixed_pairings:
      type: text
      description: 分群固定配对配置
      hint: |
        配置格式：
        {"123456789": {"111111111": "222222222", "333333333": "444444444"}}
        
        说明：
        - 键为群号，值为该群的用户-老婆配对
        - 支持一个群有多个固定配对
        - 格式必须是有效的 JSON
      default: "{}"
    not_in_group_text:
      type: string
      description: 当固定配对的老婆不在群里时的默认提示文本
      default: "你绑定的老婆今天不在这个群里哦~"
    enable_random_pairing:
      type: bool
      description: 是否启用随机配对
      default: true
    max_random_count:
      type: int
      description: 每日随机抽取群老婆的次数限制
      default: 5
    max_marry_count:
      type: int
      description: 每日强娶群老婆的次数限制
      default: 3
    max_divorce_count:
      type: int
      description: 每日离婚的次数限制
      default: 2
    max_all_marry_count:
      type: int
      description: 每日所有人都是我老婆的次数限制
      default: 1
    max_force_all_marry_count:
      type: int
      description: 每日强娶全体成员的次数限制
      default: 1
    max_all_divorce_count:
      type: int
      description: 每日全部离婚的次数限制
      default: 1
    max_relationship_graph_count:
      type: int
      description: 每日生成老婆关系网的次数限制
      default: 3
